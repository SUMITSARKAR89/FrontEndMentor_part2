    <meta charset="UTF-8" />

    <meta name="title" content="Frontend mentor challange" />
    <link rel="stylesheet" href="index.css" />

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="https://scontent.fdac138-1.fna.fbcdn.net/v/t39.30808-6/504277832_3201268406688328_2665400811850357163_n.jpg?_nc_cat=108&ccb=1-7&_nc_sid=53a332&_nc_ohc=RsQ8FB9grKkQ7kNvwGonLMG&_nc_oc=AdmPd8GCYTAODMd6pz2WVgQdmMwXvR1qCrCjHScIpVi03gTbsSe_AlrmKGtdr-cMtVU&_nc_zt=23&_nc_ht=scontent.fdac138-1.fna&_nc_gid=tRrU1h3rBbsq0J3qFtLYpA&_nc_ss=8&oh=00_AfwyqxVwC123F9IEQQdCB32iwUF2d3SM4esVq7Cn0kMLeA&oe=69BDCFA6"
    />
    <!-- font awesome cdn   --------------------------------->

    <!-- this is google font section   --------------------------------->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap"
      rel="stylesheet"
    />
    <!-- ionicon link   --------------------------------->
    <link
      href="https://cdn.jsdelivr.net/npm/remixicon@4.5.0/fonts/remixicon.css"
      rel="stylesheet"
    />
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/ionicons/7.4.0/esm/ionicons.min.js"
      integrity="sha512-heZj7rPbZHWyOEhE34vsJkzj2DKK2mZ9D3jjMkXQJ0uMGu/m5iOty+le26NL1eFZ5+qa4XBYcflwYwITwCWufw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    ></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
      integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />

    <!-- favicon section   --------------------------------->
    <link
      rel="shortcut icon"
      href="https://framerusercontent.com/images/QbZPUDfFXUG8DRCcKmLXFnnmWA.png"
      type="image/x-icon"
    />
    <script src="https://unpkg.com/scrollreveal@4.0.0/dist/scrollreveal.min.js"></script>

    <title>Frontend Mentor | Expenses chart component</title>

    <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  </head>
  <body>
    <section>
      <div class="container">
        <div class="badge">
          <div class="balance">
            <p>My balance</p>
            <span class="amount"> $921.48</span>
          </div>
          <img src="images/logo.svg" alt="" class="logo" />
        </div>
        <div class="card">
          <h3>Spending - Last 7 days</h3>
          <div class="days">
            <div class="day mon">
              <div class="tooltip"></div>
            </div>
            <div class="day tue">
              <div class="tooltip"></div>
            </div>
            <div class="day wed">
              <div class="tooltip"></div>
            </div>
            <div class="day thu">
              <div class="tooltip"></div>
            </div>
            <div class="day fri">
              <div class="tooltip"></div>
            </div>
            <div class="day sat">
              <div class="tooltip"></div>
            </div>
            <div class="day sun">
              <div class="tooltip"></div>
            </div>
          </div>
          <div class="total-container">
            <div class="totalCard">
              <p>Total this month</p>
              <span class="total">$478.33</span>
            </div>
            <div class="totalCard">
              <h5>+2.4%</h5>
              <p>from last month</p>
            </div>
          </div>
        </div>
      </div>
    </section>

    <footer class="attribution">
      Challenge by
      <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
      Coded by <a href="#">sumit sarkar</a>.
    </footer>
    <script>
      fetch("data.json")
        .then((res) => res.json())
        .then((data) => {
          data.forEach((item, i) => {
            const days = document.querySelectorAll(".days .day");
            const bar = days[i];

            bar.style.height = item.amount * 3 + "px";
            const tooltip = bar.querySelector(".tooltip");
            tooltip.innerText = "$" + item.amount;
          });
        });
    </script>
  </body>
</html>
