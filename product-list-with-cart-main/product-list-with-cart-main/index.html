    <script>
      //1. ============================
      //  LOAD PRODUCTS
      // ============================
      function init() {
        fetch("data.json")
          .then((res) => res.json())
          .then((data) => {
            products = data;
            renderProducts();
          })
          .catch((err) => {
            console.error("Failed to load products", err);
          });
      }
      init();

      //2. ============================
      //  RESPONSIVE IMAGE
      // ============================
      function getResponsiveImage(image) {
        const w = window.innerWidth;

        if (w >= 1280) return image.desktop;
        if (w >= 850) return image.tablet;

        return image.mobile;
      }

      //3. ============================
      //  GLOBAL STATE
      // ============================
      let products = [];
      let cart = {};

      // ============================
      //  SELECTORS
      // ============================
      const productContainer = document.querySelector(".cardContainer");
      const cartImg = document.getElementById("cartImg");
      const cartBody = document.getElementById("cartbody");
      const totalNumber = document.getElementById("totalNumber");

      //3.a ============================
      //  RENDER PRODUCTS
      // ============================
      function renderProducts() {
        productContainer.innerHTML = ""; // Clear old content

        products.forEach((item, index) => {
          const card = document.createElement("div");
          card.classList.add("card");
          card.setAttribute("data-id", index);

          card.innerHTML = `
      <div class="card-content">
        <div class="card-img">
          <img 
            src="${getResponsiveImage(item.image)}"
            class="product-img"
            alt="${item.name}"
          />
        </div>

        <div class="card-desc">
          <small class="title">${item.category}</small>
          <span class="pdesc">${item.name}</span>
          <span class="price">$${item.price.toFixed(2)}</span>
        </div>
      </div>

      <div class="addBtn">
        <div class="addCart">Add to Cart</div>

        <div class="plus-minus">
          <button class="minus">-</button>
          <span class="qtyCount">0</span>
          <button class="plus">+</button>
        </div>
      </div>
    `;

          productContainer.appendChild(card);
        });
        attachEvents();
      }

      //3.b ============================
      //  EVENT HANDLING (DELEGATION)
      // ============================
      function attachEvents() {
  const cards = document.querySelectorAll(".card");

  cards.forEach((card) => {
    const id = card.dataset.id;
    const product = products[id];
    const qtyEl = card.querySelector(".qtyCount");

    const addBtn = card.querySelector(".addCart");
    const plusBtn = card.querySelector(".plus");
    const minusBtn = card.querySelector(".minus");

    // Add to cart
    addBtn.addEventListener("click", () => {
      addItem(product);
      qtyEl.textContent = cart[product.name].qty;
    });

    // Increase quantity
    plusBtn.addEventListener("click", () => {
      addItem(product);
      qtyEl.textContent = cart[product.name].qty;
    });

    // Decrease quantity
    minusBtn.addEventListener("click", () => {
      removeItem(product);
      qtyEl.textContent = cart[product.name]?.qty || 0;
    });
  });
}

      // ============================
      //  CART LOGIC
      // ============================
      function addItem(product) {
        if (!cart[product.name]) {
          cart[product.name] = { ...product, qty: 1 };
        } else {
          cart[product.name].qty++;
        }

        updateCart();
      }

      function removeItem(product) {
        if (!cart[product.name]) return;

        cart[product.name].qty--;

        if (cart[product.name].qty <= 0) {
          delete cart[product.name];
        }

        updateCart();
      }

      // ============================
      //  UPDATE CART UI
      // ============================
      function updateCart() {
        const items = Object.values(cart);

        // empty cart
        if (items.length === 0) {
          cartImg.style.display = "flex";
          cartBody.style.display = "none";
          totalNumber.textContent = 0;
          return;
        }

        cartImg.style.display = "none";
        cartBody.style.display = "block";

        const totalQty = items.reduce((sum, i) => sum + i.qty, 0);
        totalNumber.textContent = totalQty;

        renderCartItems(items);
      }

      // ============================
      //  RENDER CART ITEMS
      // ============================
      function renderCartItems(items) {
        let total = 0;

        const html = items
          .map((item) => {
            const subTotal = item.qty * item.price;
            total += subTotal;

            return `
      <div class="cartItem">
        <div class="cartItemBox">
          <h6>${item.name}</h6>
          <div class="item-content">
            <span class="span">${item.qty}x</span>
            <span class="qtyPrice">$${item.price.toFixed(2)}</span>
            <span class="qtyTotal">$${subTotal.toFixed(2)}</span>
          </div>
        </div>
        <button class="delete" data-name="${item.name}">✕</button>
      </div>
    `;
          })
          .join("");

        cartBody.innerHTML = `
    ${html}

    <div class="order">
      <p>Order total</p>
      <span>$${total.toFixed(2)}</span>
    </div>

    <button id="orderBtn">Confirm Order</button>
  `;

        attachCartEvents();
      }

      // ============================
      //  CART EVENTS
      // ============================
      function attachCartEvents() {
        // delete item
        document.querySelectorAll(".delete").forEach((btn) => {
          btn.addEventListener("click", () => {
            delete cart[btn.dataset.name];
            updateCart();
            syncUI();
          });
        });

        // confirm order
        const orderBtn = document.getElementById("orderBtn");
        if (orderBtn) {
          orderBtn.addEventListener("click", showConfirmPopup);
        }
      }

      // ============================
      //  SYNC PRODUCT UI
      // ============================
      function syncUI() {
        document.querySelectorAll(".card").forEach((card) => {
          const name = card.querySelector(".pdesc").textContent;
          const qtyEl = card.querySelector(".qtyCount");

          qtyEl.textContent = cart[name]?.qty || 0;
        });
      }

      // ============================
      //  CONFIRM POPUP
      // ============================
      function showConfirmPopup() {
        const popup = document.getElementById("orderConfirm");
        const container = document.querySelector(".confirmCards");
        const totalEl = document.getElementById("confirmTotal");

        const items = Object.values(cart);

        let total = 0;

        container.innerHTML = items
          .map((item) => {
            const sub = item.qty * item.price;
            total += sub;

            return `
      <div class="confirmCard">
        <div class="c-card">
          <img src="${getResponsiveImage(item.image)}" />
          <div class="confirm-content">
            <p class="c-title">${item.name}</p>
            <p>
              <span class="c-count">${item.qty}x</span>
              <span class="c-price">$${item.price.toFixed(2)}</span>
            </p>
          </div>
        </div>
        <span class="c-total">$${sub.toFixed(2)}</span>
      </div>
    `;
          })
          .join("");

        totalEl.textContent = `$${total.toFixed(2)}`;
        popup.style.display = "block";
      }

      // ============================
      //  RESET ORDER
      // ============================
      document.getElementById("reset").addEventListener("click", () => {
        cart = {};
        updateCart();
        syncUI();

        document.getElementById("orderConfirm").style.display = "none";
      });

      // ============================
      //  RESPONSIVE IMAGE UPDATE
      // ============================
      window.addEventListener("resize", () => {
        document.querySelectorAll(".product-img").forEach((img, i) => {
          img.src = getResponsiveImage(products[i].image);
        });
      });
    </script>
