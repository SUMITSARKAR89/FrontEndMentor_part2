<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Frontend mentor challange" />

    <meta name="title" content="Frontend mentor challange" />
    <link rel="stylesheet" href="index.css" />

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="https://scontent.fdac138-1.fna.fbcdn.net/v/t39.30808-6/504277832_3201268406688328_2665400811850357163_n.jpg?_nc_cat=108&ccb=1-7&_nc_sid=53a332&_nc_ohc=RsQ8FB9grKkQ7kNvwGonLMG&_nc_oc=AdmPd8GCYTAODMd6pz2WVgQdmMwXvR1qCrCjHScIpVi03gTbsSe_AlrmKGtdr-cMtVU&_nc_zt=23&_nc_ht=scontent.fdac138-1.fna&_nc_gid=tRrU1h3rBbsq0J3qFtLYpA&_nc_ss=8&oh=00_AfwyqxVwC123F9IEQQdCB32iwUF2d3SM4esVq7Cn0kMLeA&oe=69BDCFA6"
    />
    <!-- font awesome cdn   --------------------------------->

    <!-- this is google font section   --------------------------------->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Rubik:ital,wght@0,300..900;1,300..900&display=swap"
      rel="stylesheet"
    />
    <!-- ionicon link   --------------------------------->
    <link
      href="https://cdn.jsdelivr.net/npm/remixicon@4.5.0/fonts/remixicon.css"
      rel="stylesheet"
    />
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/ionicons/7.4.0/esm/ionicons.min.js"
      integrity="sha512-heZj7rPbZHWyOEhE34vsJkzj2DKK2mZ9D3jjMkXQJ0uMGu/m5iOty+le26NL1eFZ5+qa4XBYcflwYwITwCWufw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    ></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
      integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />

    <!-- favicon section   --------------------------------->
    <link
      rel="shortcut icon"
      href="https://framerusercontent.com/images/QbZPUDfFXUG8DRCcKmLXFnnmWA.png"
      type="image/x-icon"
    />
    <script src="https://unpkg.com/scrollreveal@4.0.0/dist/scrollreveal.min.js"></script>

    <title>Frontend Mentor | Time tracking dashboard</title>

    <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  </head>
  <body>
    <section>
      <div class="container">
        <div class="box b1">
          <div class="pBox">
            <img src="images/image-jeremy.png" alt="" class="pIcon">
           <div class="boxContent">
             <p>Report for</p>
            <h2>jeremy roboson</h2>
           </div>
          </div>
          <div id="pBtn">
            <button class="btn ">Daily</button>
            <button class="btn active">Weekly</button>
            <button class="btn">Monthly</button>

          </div>
          
         
        </div>
        <div class="box b2">
          <img src="images/icon-work.svg" alt="">
          <div class="box-card">
            <span class="title">work</span>
            <img src="images/icon-ellipsis.svg" alt="" class="dot">
            <h1>32hrs</h1>
            <p>last week-36hrs</p>
          </div>
        </div>
        <div class="box b3">
          <img src="images/icon-play.svg" alt="">
          
          <div class="box-card">
            <span class="title">play</span>
            <img src="images/icon-ellipsis.svg" alt="" class="dot">
            <h1>10hrs</h1>
            <p>last week-8hrs</p>
          </div>
        </div>
        <div class="box b4">
          <img src="images/icon-study.svg" alt="">
          <div class="box-card">
            <span class="title">study</span>
            <img src="images/icon-ellipsis.svg" alt="" class="dot">
            <h1>4hrs</h1>
            <p>last week-7hrs</p>
          </div>
        </div>
        <div class="box b5">
          <img src="images/icon-exercise.svg" alt="">
          <div class="box-card">
            <span class="title">exercise</span>
            <img src="images/icon-ellipsis.svg" alt="" class="dot">
            <h1>4hrs</h1>
            <p>last week-5hrs</p>
          </div>
        </div>
        <div class="box b6">
          <img src="images/icon-social.svg" alt="">
          <div class="box-card">
            <span class="title">social</span>
            <img src="images/icon-ellipsis.svg" alt="" class="dot">
            <h1>5hrs</h1>
            <p>last week-10hrs</p>
          </div>
        </div>
        <div class="box b7">
          <img src="images/icon-self-care.svg" alt="">
          <div class="box-card">
             <span class="title">selfcare</span>
            <img src="images/icon-ellipsis.svg" alt="" class="dot">
            <h1>2hrs</h1>
            <p>last week-2hrs</p>
          </div>
        </div>
      </div>
    </section>

    <footer class="attribution">
      Challenge by
      <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
      Coded by <a href="#">Your Name Here</a>.
    </footer>
    <script src="script.js"></script>
  </body>
</html>
